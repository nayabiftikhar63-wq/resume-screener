services:
  app:
    build: .
    container_name: ai-resume-screener
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - uploads:/app/backend/uploads
      - db_data:/app/backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/stats"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  uploads:
  db_data:
